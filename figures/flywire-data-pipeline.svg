<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#1b2038"/></linearGradient><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#9fb0d0"/></marker></defs><rect width="1440" height="700" rx="28" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="70" y="75" fill="#f4f7ff" font-size="32" font-weight="700">HOW THE FLYWIRE CONNECTOME IS BUILT</text><text x="70" y="112" fill="#aab6d2" font-size="18">A data-production pipeline combining electron microscopy, automated reconstruction and human proofreading</text><g><rect x="65" y="190" width="235" height="190" rx="18" fill="#17283b" stroke="#76a9ef" stroke-width="2"/><g stroke="#76a9ef" stroke-width="3"><path d="M105 240H260M105 255H260M105 270H260M105 285H260M105 300H260"/></g><text x="182" y="335" fill="#f4f7ff" font-size="20" text-anchor="middle" font-weight="700">EM IMAGING</text><text x="182" y="360" fill="#c1d4f2" font-size="14" text-anchor="middle">Serial tissue sections</text><rect x="345" y="190" width="235" height="190" rx="18" fill="#202943" stroke="#b7a9ff" stroke-width="2"/><g fill="none" stroke="#b7a9ff" stroke-width="3"><path d="M395 280Q435 220 470 280T540 280"/><path d="M395 300Q435 240 470 300T540 300"/></g><text x="462" y="335" fill="#f4f7ff" font-size="20" text-anchor="middle" font-weight="700">AI SEGMENTATION</text><text x="462" y="360" fill="#d0c9ed" font-size="14" text-anchor="middle">Image alignment + segments</text><rect x="625" y="190" width="235" height="190" rx="18" fill="#30243a" stroke="#f0b56b" stroke-width="2"/><g stroke="#f0b56b" stroke-width="3" fill="none"><path d="M675 255L725 225L775 260L815 225M675 255L725 305L775 260L815 305"/></g><text x="742" y="335" fill="#f4f7ff" font-size="20" text-anchor="middle" font-weight="700">PROOFREADING</text><text x="742" y="360" fill="#e9cba7" font-size="14" text-anchor="middle">Human correction of cells</text><rect x="905" y="190" width="235" height="190" rx="18" fill="#173a3b" stroke="#43d9c5" stroke-width="2"/><g fill="#43d9c5"><circle cx="960" cy="250" r="8"/><circle cx="1010" cy="285" r="8"/><circle cx="1060" cy="240" r="8"/></g><g stroke="#43d9c5" stroke-width="3"><path d="M960 250L1010 285L1060 240"/></g><text x="1022" y="335" fill="#f4f7ff" font-size="20" text-anchor="middle" font-weight="700">SYNAPSES + LABELS</text><text x="1022" y="360" fill="#b6d9d2" font-size="14" text-anchor="middle">Connections + annotations</text><rect x="1185" y="190" width="190" height="190" rx="18" fill="#1d3450" stroke="#76a9ef" stroke-width="2"/><text x="1280" y="265" fill="#f4f7ff" font-size="22" text-anchor="middle" font-weight="700">CODEX</text><text x="1280" y="295" fill="#c1d4f2" font-size="15" text-anchor="middle">Static snapshots</text><text x="1280" y="325" fill="#c1d4f2" font-size="15" text-anchor="middle">Explore / download</text></g><g stroke="#9fb0d0" stroke-width="2.5" marker-end="url(#m)"><path d="M300 285H335"/><path d="M580 285H615"/><path d="M860 285H895"/><path d="M1140 285H1175"/></g><rect x="100" y="455" width="1240" height="150" rx="20" fill="#111c31" stroke="#344363"/><text x="145" y="500" fill="#43d9c5" font-size="19" font-weight="700">WHAT THE PROJECT WILL TAKE FROM FLYWIRE / CODEX</text><g fill="#d7e0f3" font-size="17"><text x="145" y="545">• Neuron IDs and available annotations</text><text x="520" y="545">• Directed pre → post connections</text><text x="900" y="545">• Synapse counts and region metadata</text><text x="145" y="580">• Dataset snapshot + provenance</text><text x="520" y="580">• Downloaded static tables for analysis</text><text x="900" y="580">• Explicit filtering and threshold rules</text></g><text x="720" y="655" fill="#aab6d2" font-size="15" text-anchor="middle">FlyWire source data are reconstructed from EM images using AI-assisted segmentation and community proofreading; schematic adapted as an original explanatory diagram.</text></g></svg>