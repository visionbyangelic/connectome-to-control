<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#1b2038"/></linearGradient><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#9fb0d0"/></marker></defs><rect width="1440" height="760" rx="28" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="70" y="75" fill="#f4f7ff" font-size="32" font-weight="700">HOW THE FIRST CIRCUIT WILL BE SELECTED</text><text x="70" y="112" fill="#aab6d2" font-size="18">A feasibility-led decision, not a choice made for visual appeal or convenience</text><rect x="480" y="155" width="480" height="76" rx="18" fill="#1d3450" stroke="#76a9ef" stroke-width="2"/><text x="720" y="187" fill="#f4f7ff" font-size="22" font-weight="700" text-anchor="middle">CANDIDATE DROSOPHILA CIRCUITS</text><text x="720" y="212" fill="#c1d4f2" font-size="15" text-anchor="middle">From primary literature + connectome annotations</text><path d="M720 231V270" stroke="#9fb0d0" stroke-width="2" marker-end="url(#m)"/><rect x="350" y="280" width="740" height="100" rx="18" fill="#202943" stroke="#b7a9ff" stroke-width="2"/><text x="720" y="318" fill="#f4f7ff" font-size="21" font-weight="700" text-anchor="middle">BIOLOGICAL + DATA FEASIBILITY SCREEN</text><text x="720" y="350" fill="#d0c9ed" font-size="16" text-anchor="middle">Interpretable anatomy • annotations • connectivity coverage • primary literature</text><path d="M720 380V420" stroke="#9fb0d0" stroke-width="2" marker-end="url(#m)"/><rect x="350" y="430" width="740" height="110" rx="18" fill="#30243a" stroke="#f0b56b" stroke-width="2"/><text x="720" y="468" fill="#f4f7ff" font-size="21" font-weight="700" text-anchor="middle">FUNCTION + MODELLING FEASIBILITY</text><text x="720" y="500" fill="#e9cba7" font-size="16" text-anchor="middle">Defined sensory / motor role • measurable output • plausible neural model</text><text x="720" y="522" fill="#e9cba7" font-size="14" text-anchor="middle">Potential task link and simulator compatibility are assessed, not presumed.</text><path d="M720 540V580" stroke="#9fb0d0" stroke-width="2" marker-end="url(#m)"/><rect x="430" y="590" width="580" height="90" rx="18" fill="#173a3b" stroke="#43d9c5" stroke-width="2"/><text x="720" y="628" fill="#f4f7ff" font-size="22" font-weight="700" text-anchor="middle">SELECT ONE TRACTABLE CIRCUIT</text><text x="720" y="653" fill="#b6d9d2" font-size="15" text-anchor="middle">Record evidence, trade-offs, exclusions and unresolved gaps</text><rect x="65" y="300" width="220" height="155" rx="18" fill="#3a2d22" stroke="#f0b56b"/><text x="175" y="345" fill="#f4f7ff" font-size="19" font-weight="700" text-anchor="middle">FAILS A</text><text x="175" y="372" fill="#f4f7ff" font-size="19" font-weight="700" text-anchor="middle">CRITICAL GATE?</text><text x="175" y="410" fill="#e9cba7" font-size="15" text-anchor="middle">Exclude or defer;</text><text x="175" y="433" fill="#e9cba7" font-size="15" text-anchor="middle">document why</text><path d="M350 330H295" stroke="#f0b56b" stroke-width="2" marker-end="url(#m)"/><rect x="1155" y="300" width="220" height="155" rx="18" fill="#17283b" stroke="#76a9ef"/><text x="1265" y="345" fill="#f4f7ff" font-size="19" font-weight="700" text-anchor="middle">NO FINAL</text><text x="1265" y="372" fill="#f4f7ff" font-size="19" font-weight="700" text-anchor="middle">CIRCUIT YET</text><text x="1265" y="410" fill="#c1d4f2" font-size="15" text-anchor="middle">This diagram shows</text><text x="1265" y="433" fill="#c1d4f2" font-size="15" text-anchor="middle">the decision process</text><path d="M1090 480H1145" stroke="#9fb0d0" stroke-width="2" marker-end="url(#m)"/><text x="720" y="720" fill="#aab6d2" font-size="15" text-anchor="middle">No circuit is selected until the literature review and data audit support the scientific question.</text></g></svg>