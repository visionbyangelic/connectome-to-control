<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#1b2038"/></linearGradient><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#9fb0d0"/></marker></defs><rect width="1440" height="760" rx="28" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="70" y="75" fill="#f4f7ff" font-size="32" font-weight="700">NEUROMECHFLY v2: AN EMBODIED SENSORIMOTOR LOOP</text><text x="70" y="112" fill="#aab6d2" font-size="18">The virtual fly is a physical body in a simulated world, not just a neural network on a screen.</text><rect x="65" y="185" width="285" height="190" rx="20" fill="#17283b" stroke="#76a9ef" stroke-width="2"/><text x="207" y="228" fill="#f4f7ff" font-size="21" font-weight="700" text-anchor="middle">ENVIRONMENT</text><g fill="none" stroke="#76a9ef" stroke-width="3"><path d="M110 285H300M110 310H300M150 260V335M260 260V335"/></g><text x="207" y="350" fill="#c1d4f2" font-size="15" text-anchor="middle">Visual / olfactory cues</text><rect x="425" y="185" width="285" height="190" rx="20" fill="#202943" stroke="#b7a9ff" stroke-width="2"/><text x="567" y="228" fill="#f4f7ff" font-size="21" font-weight="700" text-anchor="middle">SENSORY INPUT</text><text x="567" y="275" fill="#d0c9ed" font-size="16" text-anchor="middle">Vision + olfaction</text><text x="567" y="305" fill="#d0c9ed" font-size="16" text-anchor="middle">Terrain / contact cues</text><text x="567" y="350" fill="#d0c9ed" font-size="14" text-anchor="middle">Sensor models in FlyGym</text><rect x="785" y="185" width="285" height="190" rx="20" fill="#30243a" stroke="#f0b56b" stroke-width="2"/><text x="927" y="228" fill="#f4f7ff" font-size="21" font-weight="700" text-anchor="middle">CONTROLLER</text><text x="927" y="275" fill="#e9cba7" font-size="16" text-anchor="middle">Neural / hybrid control</text><text x="927" y="305" fill="#e9cba7" font-size="15" text-anchor="middle">Project's proposed adapter</text><text x="927" y="350" fill="#e9cba7" font-size="14" text-anchor="middle">Not a built-in connectome coupling</text><rect x="1145" y="185" width="230" height="190" rx="20" fill="#173a3b" stroke="#43d9c5" stroke-width="2"/><text x="1260" y="228" fill="#f4f7ff" font-size="21" font-weight="700" text-anchor="middle">MOTOR OUTPUT</text><text x="1260" y="275" fill="#b6d9d2" font-size="16" text-anchor="middle">Joint / muscle</text><text x="1260" y="305" fill="#b6d9d2" font-size="16" text-anchor="middle">control signals</text><text x="1260" y="350" fill="#b6d9d2" font-size="14" text-anchor="middle">Locomotion / steering</text><g stroke="#9fb0d0" stroke-width="2.5" marker-end="url(#m)"><path d="M350 280H415"/><path d="M710 280H775"/><path d="M1070 280H1135"/></g><rect x="430" y="465" width="580" height="165" rx="22" fill="#111c31" stroke="#55c6a9" stroke-width="2"/><text x="720" y="505" fill="#55c6a9" font-size="21" font-weight="700" text-anchor="middle">NEUROMECHFLY v2 / FLYGYM + MUJOCO</text><text x="720" y="545" fill="#f4f7ff" font-size="17" text-anchor="middle">Articulated fly body • physics • legs and adhesion</text><text x="720" y="575" fill="#c6d1e7" font-size="16" text-anchor="middle">3D locomotion • complex terrain • sensorimotor interaction</text><text x="720" y="605" fill="#c6d1e7" font-size="14" text-anchor="middle">Simulation state, contacts and task metrics are recorded</text><path d="M1260 375V430H1015V455" fill="none" stroke="#9fb0d0" stroke-width="2.5" marker-end="url(#m)"/><path d="M430 545H300V390H207V385" fill="none" stroke="#9fb0d0" stroke-width="2.5" marker-end="url(#m)"/><text x="360" y="430" fill="#aab6d2" font-size="14" text-anchor="middle">closed-loop body state</text><rect x="65" y="485" width="280" height="120" rx="18" fill="#30243a" stroke="#b7a9ff"/><text x="205" y="530" fill="#f4f7ff" font-size="19" font-weight="700" text-anchor="middle">PROJECT RESEARCH</text><text x="205" y="560" fill="#d0c9ed" font-size="15" text-anchor="middle">Connectome-constrained</text><text x="205" y="583" fill="#d0c9ed" font-size="15" text-anchor="middle">neural model</text><path d="M345 545H420" stroke="#b7a9ff" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#m)"/><text x="382" y="525" fill="#b7a9ff" font-size="13" text-anchor="middle">optional</text><text x="720" y="690" fill="#aab6d2" font-size="15" text-anchor="middle">Conceptual integration target. NeuroMechFly v2 supplies the embodied simulation; this project must implement and validate its own neural-to-control interface.</text></g></svg>