<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#1b2038"/></linearGradient><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#9fb0d0"/></marker></defs><rect width="1440" height="640" rx="28" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="70" y="75" fill="#f4f7ff" font-size="32" font-weight="700">WHAT A CONNECTOME REPRESENTS</text><text x="70" y="112" fill="#aab6d2" font-size="18">Neurons are nodes; directed synaptic connections are edges.</text><rect x="65" y="155" width="850" height="410" rx="24" fill="#111c31" stroke="#344363"/><g stroke="#76a9ef" stroke-width="4" fill="none" marker-end="url(#m)"><path d="M190 310L365 240"/><path d="M190 310L370 430"/><path d="M390 240L565 310"/><path d="M390 430L565 310"/><path d="M590 310L765 230"/><path d="M590 310L765 430"/><path d="M390 240L390 430" opacity=".35"/><path d="M765 230L765 430" opacity=".35"/></g><g fill="#43d9c5" stroke="#c4fff5" stroke-width="2"><circle cx="180" cy="310" r="28"/><circle cx="380" cy="240" r="28"/><circle cx="380" cy="430" r="28"/><circle cx="580" cy="310" r="28"/><circle cx="780" cy="230" r="28"/><circle cx="780" cy="430" r="28"/></g><g fill="#0b1020" font-size="15" font-weight="700" text-anchor="middle"><text x="180" y="315">A</text><text x="380" y="245">B</text><text x="380" y="435">C</text><text x="580" y="315">D</text><text x="780" y="235">E</text><text x="780" y="435">F</text></g><g fill="#aab6d2" font-size="15"><text x="120" y="505">Presynaptic neuron</text><text x="330" y="505">Intermediate neurons</text><text x="680" y="505">Downstream targets</text></g><rect x="955" y="155" width="420" height="410" rx="24" fill="#17283b" stroke="#43d9c5"/><text x="1000" y="205" fill="#43d9c5" font-size="20" font-weight="700">GRAPH ABSTRACTION</text><text x="1000" y="260" fill="#f4f7ff" font-size="24" font-weight="700">G = (V, E, W)</text><text x="1000" y="305" fill="#d7e0f3" font-size="18">V  Neurons (nodes)</text><text x="1000" y="345" fill="#d7e0f3" font-size="18">E  Directed synaptic edges</text><text x="1000" y="385" fill="#d7e0f3" font-size="18">W  Documented edge attributes</text><path d="M1000 415H1325" stroke="#405573"/><text x="1000" y="455" fill="#f0b56b" font-size="16" font-weight="700">Important distinction</text><text x="1000" y="488" fill="#c6d1e7" font-size="15">Synapse counts describe anatomy.</text><text x="1000" y="514" fill="#c6d1e7" font-size="15">They are not automatically synaptic</text><text x="1000" y="540" fill="#c6d1e7" font-size="15">conductance or physiological efficacy.</text><text x="720" y="610" fill="#aab6d2" font-size="15" text-anchor="middle">Conceptual schematic only; not a reconstruction of a specific fly circuit.</text></g></svg>